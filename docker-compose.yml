# Local-only PostGIS for Milestone 1. Not used in production / hosted Supabase.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: mamdani-ticketer-db
    environment:
      POSTGRES_DB: mamdani
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Host 5432 if free; override with DB_HOST_PORT=5433 when 5432 is taken.
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - mamdani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mamdani"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mamdani_pgdata:
